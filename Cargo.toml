[workspace]
resolver = "2"
members = ["core", "forensic"]

# Single source of truth for fields shared by both members (DRY): the reader
# (`hfsplus-core`) and the analyzer (`hfsplus-forensic`) publish independently
# but share edition, license, MSRV floor, repository metadata and lint posture.
[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/hfsplus-forensic"
homepage = "https://github.com/SecurityRonin/hfsplus-forensic"
readme = "README.md"

[workspace.dependencies]
hfsplus-core = { version = "0.1.0", path = "core" }
# decmpfs transparent-compression codecs (reuse, not reinvent): zlib/DEFLATE
# (types 3/4) and LZVN/LZFSE (types 7/8/11/12). All pure-Rust, keeping
# `unsafe_code = "forbid"` intact.
flate2 = "1"
lzfse_rust = "0.2"
lzvn = { version = "0.1", package = "lzvn-core" }
# decmpfs format knowledge (magic, type→algorithm/storage map, chunk size) and
# the report model for findings.
forensicnomicon = "1"
safe-read = "0.1"
# Universal read-only VFS contract. Optional: the `FileSystem` adapter lives
# behind the `vfs` feature. Safe Rust, so `unsafe_code = "forbid"` stays intact.
forensic-vfs = { version = "0.9" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all                      = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
correctness              = { level = "deny", priority = -1 }
suspicious               = { level = "deny", priority = -1 }
unwrap_used              = { level = "deny", priority = 0 }
expect_used              = { level = "deny", priority = 0 }
module_name_repetitions  = { level = "allow", priority = 1 }
must_use_candidate       = { level = "allow", priority = 1 }
missing_errors_doc       = { level = "allow", priority = 1 }
missing_panics_doc       = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap       = { level = "allow", priority = 1 }
cast_sign_loss           = { level = "allow", priority = 1 }
cast_precision_loss      = { level = "allow", priority = 1 }
too_many_lines           = { level = "allow", priority = 1 }
items_after_statements   = { level = "allow", priority = 1 }
similar_names            = { level = "allow", priority = 1 }
manual_let_else          = { level = "allow", priority = 1 }
